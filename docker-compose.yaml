services:
  postgres:
    image: postgres:latest
    container_name: incidentHub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentHub
      POSTGRES_USER: incidentHub
      POSTGRES_PASSWORD: incidentHub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: incidentHub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: incidenthub_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data:
  redis_data: